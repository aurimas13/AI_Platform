<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none">
  <defs>
    <!-- Paper background, slightly off-center wash to feel printed, not flat -->
    <radialGradient id="paper" cx="38%" cy="36%" r="78%">
      <stop offset="0"   stop-color="#F8F1E0"/>
      <stop offset="0.55" stop-color="#F1E8CE"/>
      <stop offset="1"   stop-color="#E5D9B6"/>
    </radialGradient>

    <!-- Brass, foil-like -->
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#E8CD8B"/>
      <stop offset="0.45" stop-color="#C8943B"/>
      <stop offset="1"    stop-color="#6B4612"/>
    </linearGradient>
    <linearGradient id="brassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5E6C7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6B4612" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1A14"/>
      <stop offset="1" stop-color="#14110D"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1C1714" flood-opacity="0.14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.11
                              0 0 0 0 0.09
                              0 0 0 0 0.08
                              0 0 0 0.05 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- ===== background ===== -->
  <rect width="1200" height="1200" fill="url(#paper)"/>
  <!-- subtle grain overlay -->
  <rect width="1200" height="1200" fill="#1C1714" opacity="0.025" filter="url(#grain)"/>

  <!-- editorial frame: thin double rule -->
  <rect x="56" y="56" width="1088" height="1088" fill="none" stroke="#C7B786" stroke-width="1.5"/>
  <rect x="64" y="64" width="1072" height="1072" fill="none" stroke="#C7B786" stroke-opacity="0.55" stroke-width="1"/>

  <!-- corner crop marks (print feel) -->
  <g stroke="#9C6A1F" stroke-width="2" stroke-linecap="square">
    <path d="M40 80 L40 40 L80 40"/>
    <path d="M1160 80 L1160 40 L1120 40"/>
    <path d="M40 1120 L40 1160 L80 1160"/>
    <path d="M1160 1120 L1160 1160 L1120 1160"/>
  </g>

  <!-- ===== top meta strip ===== -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" fill="#6B5F4F" letter-spacing="3">
    <text x="120" y="138">NO. 01 · GATEWAY</text>
    <text x="1080" y="138" text-anchor="end">MMXXVI</text>
  </g>
  <line x1="120" y1="160" x2="1080" y2="160" stroke="#C7B786" stroke-width="1"/>

  <!-- ===== central monogram: hexagon gate ===== -->
  <g transform="translate(600 540)" filter="url(#softShadow)">
    <!-- outer brass hex -->
    <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150" fill="url(#brass)"/>
    <!-- highlight stroke on top half -->
    <polygon points="0,-300 260,-150 260,0 -260,0 -260,-150" fill="url(#brassEdge)" opacity="0.55"/>
    <!-- inner ink hex -->
    <polygon points="0,-228 198,-114 198,114 0,228 -198,114 -198,-114" fill="url(#ink)"/>
    <!-- thin brass inset rule -->
    <polygon points="0,-208 180,-104 180,104 0,208 -180,104 -180,-104"
             fill="none" stroke="#C8943B" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- gate aperture: arrow / portal mark made of two chevrons -->
    <g stroke="#E8CD8B" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter" fill="none">
      <polyline points="-86,-92 28,0 -86,92"/>
      <polyline points="8,-92 122,0 8,92" stroke="#F5E6C7"/>
    </g>

    <!-- tiny brass stud at vertices -->
    <g fill="#F5E6C7">
      <circle cx="0"    cy="-300" r="5"/>
      <circle cx="260"  cy="-150" r="5"/>
      <circle cx="260"  cy="150"  r="5"/>
      <circle cx="0"    cy="300"  r="5"/>
      <circle cx="-260" cy="150"  r="5"/>
      <circle cx="-260" cy="-150" r="5"/>
    </g>
  </g>

  <!-- ===== wordmark ===== -->
  <g text-anchor="middle">
    <text x="600" y="970"
          font-family="Fraunces, 'Iowan Old Style', Georgia, serif"
          font-size="148" font-weight="600" fill="#1C1714" letter-spacing="-4">
      AI <tspan font-style="italic" fill="#9C6A1F">Gateway</tspan>
    </text>

    <!-- rule + tagline -->
    <line x1="430" y1="1018" x2="770" y2="1018" stroke="#9C6A1F" stroke-width="2"/>
    <text x="600" y="1072"
          font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="22" fill="#3A3026" letter-spacing="6">
      ONBOARDING · DESIGNED FOR ACTIVATION
    </text>
  </g>

  <!-- ===== bottom meta strip ===== -->
  <line x1="120" y1="1108" x2="1080" y2="1108" stroke="#C7B786" stroke-width="1"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" fill="#6B5F4F" letter-spacing="3">
    <text x="120" y="1148">GATEWAY.AURIMAS.IO</text>
    <text x="1080" y="1148" text-anchor="end">A. NAUSĖDAS</text>
  </g>
</svg>
